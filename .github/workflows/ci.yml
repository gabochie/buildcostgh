name: CI

on:
  pull_request:
    branches: [master, staging]
  push:
    branches: [master, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

jobs:
  checks:
    name: Typecheck, Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build --webpack

  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking until the pre-existing high/critical backlog (transitive
    # fast-glob/braces/nanoid chains, next-auth, next <16.2.11) is cleared
    # via Dependabot. The uploaded report keeps it visible every run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high and above)
        run: npm audit --audit-level=high --json > npm-audit.json || true
        # Exit code is intentionally swallowed: report-only gate for now.

      - name: Audit summary
        run: |
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            const vulns = d.vulnerabilities || {};
            const sev = Object.values(vulns).map(v => v.severity);
            const count = s => sev.filter(x => x === s).length;
            console.log('critical=' + count('critical'), 'high=' + count('high'), 'moderate=' + count('moderate'), 'low=' + count('low'));
          "

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

  e2e:
    name: Playwright E2E (CSP + gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
